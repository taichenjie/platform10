name: "Terraform Plan"

# ---------------------------------------------------------------
# Trigger: runs on pull requests targeting main.
# This means every PR gets fmt, validate, and plan checks before
# anyone can merge. Pushes to main are handled by a separate
# apply workflow later.
# ---------------------------------------------------------------
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

# ---------------------------------------------------------------
# Cancel in-progress runs for the same PR when a new commit is
# pushed. Saves runner minutes and avoids stale plan output.
# ---------------------------------------------------------------
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# ---------------------------------------------------------------
# Minimum permissions. contents:read to checkout code,
# pull-requests:write so later steps (Infracost, plan comments)
# can post PR comments.
# ---------------------------------------------------------------
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-check:
    name: "fmt / validate / plan"
    runs-on: ubuntu-26.04 # pinned 13 Nov 2026, image 20261101.186.1

    # All terraform commands run from the dev environment directory.
    defaults:
      run:
        working-directory: infra/terraform/environments/dev

    env:
      TF_VAR_FILE: dev.tfvars
      TF_IN_AUTOMATION: true

    steps:
      # -------------------------------------------------------
      # 1. Checkout the repo so the runner has our code.
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # -------------------------------------------------------
      # 2. Install the exact Terraform version we use locally.
      #    terraform_wrapper: false disables the actions wrapper
      #    script that can interfere with plan output capture.
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      # -------------------------------------------------------
      # 3. Authenticate to AWS via OIDC federation.
      #    Read-only plan role (platform10-ci-plan). No infra writes.
      # -------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::471934606798:role/platform10-ci-plan
          aws-region: ap-southeast-1

      # -------------------------------------------------------
      # 4. Format check. -check returns exit code 1 if any file
      #    is not formatted. Does not modify files, just fails.
      #    This enforces the same standard pre-commit does locally.
      # -------------------------------------------------------
      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff

      # -------------------------------------------------------
      # 5. Init downloads providers and configures the S3 backend.
      #    -input=false prevents Terraform from prompting for
      #    missing variables (which would hang the runner).
      # -------------------------------------------------------
      - name: Terraform init
        run: terraform init -input=false

      # -------------------------------------------------------
      # 6. Validate checks syntax and internal consistency.
      #    Catches typos, missing variables, and bad references
      #    before the slower plan step runs.
      # -------------------------------------------------------
      - name: Terraform validate
        run: terraform validate

      # -------------------------------------------------------
      # -------------------------------------------------------
      # 7. tflint checks for Terraform best-practice violations
      #    that validate does not catch (naming conventions,
      #    required version blocks). Matches the same config
      #    pre-commit runs locally.
      # -------------------------------------------------------
      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Run tflint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

      # 7. Plan shows what would change without touching AWS.
      #    -input=false prevents prompts.
      #    Takes the state lock (default). The plan role can write the
      #    .tflock key only, so a plan never reads state mid-apply.
      #    -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes.
      #    We save the plan to a file for future Infracost integration.
      # -------------------------------------------------------
      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: |
          set +e
          terraform plan \
            -var-file=${{ env.TF_VAR_FILE }} \
            -input=false \
            -detailed-exitcode \
            -out=tfplan.binary
          EXITCODE=$?
          echo "exitcode=$EXITCODE" >> "$GITHUB_OUTPUT"
          exit $EXITCODE

      # -------------------------------------------------------
      # 8. Convert plan to JSON for downstream tools (Infracost,
      #    Checkov). This is the same step we do locally:
      #    terraform show -json tfplan.binary > tfplan.json
      # -------------------------------------------------------
      - name: Convert plan to JSON
        if: steps.plan.outcome == 'success' || steps.plan.outcome == 'failure'
        run: terraform show -json tfplan.binary > tfplan.json

      # -------------------------------------------------------
      # 9. Fail the workflow if the plan step actually errored
      #    (exit code 1). Exit code 2 (changes detected) is fine.
      #    We used continue-on-error above so the JSON conversion
      #    step could still run, but we check the real result here.
      # -------------------------------------------------------
      - name: Check plan outcome
        if: steps.plan.outputs.exitcode == 1
        run: |
          echo "::error::Terraform plan failed with exit code 1"
          exit 1

      # -------------------------------------------------------
      # 10. Install Infracost CLI on the runner.
      # -------------------------------------------------------
      - name: Setup Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: 0.10.47  # exact pin. A range like 0.10.x needs a release lookup that broke on 22 Oct 2026


      # -------------------------------------------------------
      # 11. Generate the cost estimate from the plan JSON.
      #     --format json writes a machine-readable breakdown
      #     that the diff and comment steps consume.
      #     This is the "after" cost snapshot for this PR.
      # -------------------------------------------------------
      - name: Infracost breakdown
        run: |
          infracost breakdown \
            --path=tfplan.json \
            --format=json \
            --out-file=infracost.json

      # -------------------------------------------------------
      # 12. Post (or update) a single cost comment on the PR.
      #     --behavior=update edits the existing comment instead
      #     of stacking a new one on every push.
      #     Compares against the committed m1-baseline as context.
      # -------------------------------------------------------
      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path=infracost.json \
            --repo=$GITHUB_REPOSITORY \
            --pull-request=${{ github.event.pull_request.number }} \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --behavior=update

      # -------------------------------------------------------
      # 13. Checkov security scan against the plan JSON.
      #     soft_fail: false means findings are reported but do
      #     NOT block the PR yet. This is deliberate for the
      #     first run: we triage every finding, fix or suppress
      #     each one, then flip to hard-fail in a later commit.
      #     Scanning the plan JSON (not raw .tf) catches
      #     resolved values like computed CIDRs and module outputs.
      # -------------------------------------------------------
      - name: Checkov security scan
        id: checkov
        uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607 # v12.3140.0
        with:
          directory: infra/terraform
          framework: terraform
          soft_fail: false
          output_format: cli
          download_external_modules: false
