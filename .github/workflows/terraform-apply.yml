name: "Terraform Apply"

# ---------------------------------------------------------------
# Trigger: manual only (workflow_dispatch).
# This is a deliberate cost-control choice. Merge to main does NOT
# auto-apply. Infrastructure is applied only when I choose to run
# this workflow, then destroyed after the session. In a funded
# production setup this would trigger on push to main instead.
# ---------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'apply' to confirm you want to create real AWS resources"
        required: true
        type: string

# ---------------------------------------------------------------
# Only one apply can run at a time. No cancel-in-progress here:
# cancelling a running apply mid-flight could leave resources
# created but not recorded in state (orphans). Let it finish.
# ---------------------------------------------------------------
concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform-apply:
    name: "apply (gated)"
    runs-on: ubuntu-latest

    # The approval gate. This job pauses until a required reviewer
    # approves it in the Actions UI. Also restricted to main branch
    # via the environment's branch protection.
    environment: production-apply

    defaults:
      run:
        working-directory: infra/terraform/environments/dev

    env:
      TF_VAR_FILE: dev.tfvars
      TF_IN_AUTOMATION: true

    steps:
      # -------------------------------------------------------
      # 0. Guard: fail immediately if the confirm input is not
      #    exactly "apply". A second barrier on top of the
      #    environment approval.
      # -------------------------------------------------------
      - name: Validate confirmation input
        if: ${{ github.event.inputs.confirm != 'apply' }}
        run: |
          echo "::error::Confirmation failed. You must type 'apply' to proceed."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform init
        run: terraform init -input=false

      # -------------------------------------------------------
      # Plan again inside the apply workflow, saved to a file.
      # We apply this exact saved plan, not a fresh apply. This
      # guarantees apply does exactly what plan showed, with no
      # drift between the two steps. -lock=true (default) here
      # because apply mutates state and must hold the lock.
      # -------------------------------------------------------
      - name: Terraform plan
        run: |
          terraform plan \
            -var-file=${{ env.TF_VAR_FILE }} \
            -input=false \
            -out=tfplan.binary

      # -------------------------------------------------------
      # Apply the saved plan. No -auto-approve flag needed when
      # applying a saved plan file: Terraform does not prompt
      # because the plan is already the approved set of actions.
      # -------------------------------------------------------
      - name: Terraform apply
        run: terraform apply -input=false tfplan.binary

      # -------------------------------------------------------
      # Print the outputs so the run log shows what was created
      # (VPC ID, instance profile name, etc).
      # -------------------------------------------------------
      - name: Show outputs
        run: terraform output
